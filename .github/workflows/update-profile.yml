name: Update Profile Telemetry

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live SVG cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py --live

      - name: Commit updated telemetry (keep single commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ data/stats_snapshot.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            git push --force origin HEAD:main
          fi
